services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL:-http://localhost:8001}
        VITE_3D_TILES_URL: ${VITE_3D_TILES_URL:-}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-warn}
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISASTERAWARE_USERNAME: ${DISASTERAWARE_USERNAME:-}
      DISASTERAWARE_PASSWORD: ${DISASTERAWARE_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-router}
      VOLCENGINE_WORKFLOW_API_URL: ${VOLCENGINE_WORKFLOW_API_URL:-}
      VOLCENGINE_WORKFLOW_API_KEY: ${VOLCENGINE_WORKFLOW_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      VOLCENGINE_ARK_MODEL: ${VOLCENGINE_ARK_MODEL:-}
      VOLCENGINE_ARK_API_URL: ${VOLCENGINE_ARK_API_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      VOLCENGINE_ARK_TIMEOUT_MS: ${VOLCENGINE_ARK_TIMEOUT_MS:-30000}
    ports:
      - "8080:8080"
    depends_on:
      analytics:
        condition: service_healthy

  analytics:
    build:
      context: ./python-analytics-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:-}
      ANALYTICS_CORS_ORIGINS: ${ANALYTICS_CORS_ORIGINS:-}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
