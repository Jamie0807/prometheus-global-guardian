services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_3D_TILES_URL: ${VITE_3D_TILES_URL:-}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-warn}
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://prometheus:prometheus@db:5432/prometheus?schema=public}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics:8001}
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}
      DISASTERAWARE_USERNAME: ${DISASTERAWARE_USERNAME:-}
      DISASTERAWARE_PASSWORD: ${DISASTERAWARE_PASSWORD:-}
      BFF_AI_STREAM_RESUME_TTL_MS: ${BFF_AI_STREAM_RESUME_TTL_MS:-30000}
      BFF_AI_STREAM_RESUME_MAX_EVENTS: ${BFF_AI_STREAM_RESUME_MAX_EVENTS:-256}
      BFF_AI_STREAM_RESUME_MAX_BYTES: ${BFF_AI_STREAM_RESUME_MAX_BYTES:-524288}
      BFF_AI_STREAM_RESUME_MAX_SESSIONS: ${BFF_AI_STREAM_RESUME_MAX_SESSIONS:-100}
      AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AUTH_SESSION_IDLE_TTL_MS: ${AUTH_SESSION_IDLE_TTL_MS:-1800000}
      AUTH_SESSION_ABSOLUTE_TTL_MS: ${AUTH_SESSION_ABSOLUTE_TTL_MS:-604800000}
      BFF_REGISTER_RATE_LIMIT_MAX: ${BFF_REGISTER_RATE_LIMIT_MAX:-5}
      BFF_LOGIN_RATE_LIMIT_MAX: ${BFF_LOGIN_RATE_LIMIT_MAX:-10}
      AI_PROVIDER: ${AI_PROVIDER:-router}
      VOLCENGINE_WORKFLOW_API_URL: ${VOLCENGINE_WORKFLOW_API_URL:-}
      VOLCENGINE_WORKFLOW_API_KEY: ${VOLCENGINE_WORKFLOW_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      VOLCENGINE_ARK_MODEL: ${VOLCENGINE_ARK_MODEL:-}
      VOLCENGINE_ARK_API_URL: ${VOLCENGINE_ARK_API_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      VOLCENGINE_ARK_TIMEOUT_MS: ${VOLCENGINE_ARK_TIMEOUT_MS:-30000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prometheus}
      POSTGRES_USER: ${POSTGRES_USER:-prometheus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prometheus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:-}
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}
      ANALYTICS_CORS_ORIGINS: ${ANALYTICS_CORS_ORIGINS:-}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
